name: glow-alert

on:
  schedule:
    # Twice a day, in the timezone given below, matching the notify_at times in
    # config.example.toml (08:00 and 21:00). Change the hours and timezone to your
    # own notify_at values (see README). Minute 17 avoids the busy top of the hour.
    - cron: "17 8,21 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the email in the log instead of sending it"
        type: boolean
        default: true
      ignore_schedule:
        description: "Treat every subscription as due now (test run; nothing is logged)"
        type: boolean
        default: true

permissions:
  contents: write  # commit state/sent.json

concurrency:
  group: glow-alert
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # A fresh copy has no config.toml yet; skip quietly instead of failing
      # (and mailing the owner) on every scheduled run until it is added.
      - name: Check config
        id: config
        run: |
          if [ -f config.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::config.toml not found; skipping. See README to set up."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Check forecast and send
        if: steps.config.outputs.present == 'true'
        env:
          SUNSETHUE_API_KEY: ${{ secrets.SUNSETHUE_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        # Inputs are compared to both true and 'true': an API-triggered dispatch may
        # pass them as strings, and the string 'false' would otherwise count as true.
        # On schedule events inputs are empty, so both flags stay off.
        run: >
          python -m glow_alert run --config config.toml --state state/sent.json
          ${{ (inputs.dry_run == true || inputs.dry_run == 'true') && '--dry-run' || '' }}
          ${{ (inputs.ignore_schedule == true || inputs.ignore_schedule == 'true') && '--ignore-schedule' || '' }}

      - name: Commit decision log
        # Runs after a failed tick too, so decisions made for healthy subscriptions are kept.
        if: ${{ always() && steps.config.outputs.present == 'true' && !(inputs.dry_run == true || inputs.dry_run == 'true') && !(inputs.ignore_schedule == true || inputs.ignore_schedule == 'true') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sent.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "state: record glow-alert decisions"
          git pull --rebase
          git push
